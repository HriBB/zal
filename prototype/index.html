<!-- ====================== switcher ====================== -->
<script>
const VARIANTS = [
  { key: 'a', name: 'Institucionalna', render: variantA },
  { key: 'b', name: 'Pergament',       render: variantB },
  { key: 'c', name: 'Belina',          render: variantC },
  { key: 'd', name: 'Razstava',        render: variantD },
  { key: 'e', name: 'Mozaik',          render: variantE },
];

function currentKey() {
  const k = new URLSearchParams(location.search).get('variant');
  return VARIANTS.some(v => v.key === k) ? k : 'a';
}

function render() {
  const v = VARIANTS.find(v => v.key === currentKey());
  document.getElementById('app').innerHTML = v.render();
  document.getElementById('sw-label').textContent = `${v.key.toUpperCase()} — ${v.name}`;
  document.title = `ZAL prototip · ${v.key.toUpperCase()} ${v.name}`;
  window.scrollTo(0, 0);
}

function cycle(dir) {
  const i = VARIANTS.findIndex(v => v.key === currentKey());
  const next = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length];
  const url = new URL(location);
  url.searchParams.set('variant', next.key);
  history.replaceState(null, '', url);
  render();
}

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t instanceof Element && t.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

// floating bar — deliberately ugly-neutral so it's obviously not part of any design
const bar = document.createElement('div');
bar.innerHTML = `
  <div style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;
              display:flex;align-items:center;gap:4px;background:#111;color:#fff;
              border-radius:999px;padding:6px 8px;font:13px/1 -apple-system,sans-serif;
              box-shadow:0 4px 20px rgba(0,0,0,.4);">
    <button id="sw-prev" style="all:unset;cursor:pointer;padding:6px 10px;border-radius:999px;">◀</button>
    <span id="sw-label" style="min-width:150px;text-align:center;font-weight:600;letter-spacing:.02em;"></span>
    <button id="sw-next" style="all:unset;cursor:pointer;padding:6px 10px;border-radius:999px;">▶</button>
  </div>`;
document.body.appendChild(bar);
document.getElementById('sw-prev').onclick = () => cycle(-1);
document.getElementById('sw-next').onclick = () => cycle(1);

render();
</script>
</body>
</html>
